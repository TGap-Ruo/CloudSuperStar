<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 超星学习通自动化</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --border:#e6e9f0; --text:#1f2430; --muted:#6b7280;
          --primary:#2563eb; --shadow:0 1px 3px rgba(16,24,40,.06), 0 16px 40px -20px rgba(16,24,40,.3); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#171b23; --border:#262c38; --text:#e6e9ef; --muted:#9aa3b2; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:linear-gradient(140deg,#1e3a8a,#2563eb 45%,#3b82f6); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px;
          box-shadow:var(--shadow); width:380px; max-width:100%; overflow:hidden; }
  .head { padding:26px 26px 8px; }
  h1 { font-size:19px; color:var(--text); font-weight:600; }
  .sub { font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.6; }
  .body { padding:18px 26px 26px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px;
          font-size:14px; background:transparent; color:var(--text); outline:none; font-family:inherit;
          transition:border-color .15s, box-shadow .15s; }
  input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.14); }
  .field { margin-bottom:14px; }
  button { width:100%; padding:11px; border:none; border-radius:9px; background:var(--primary); color:#fff;
           font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
  button:hover { filter:brightness(.95); }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .error { background:#fee2e2; color:#b91c1c; padding:9px 12px; border-radius:8px;
           font-size:12.5px; margin-bottom:14px; }
  .tip { font-size:12px; color:var(--muted); margin-top:16px; line-height:1.7; }
  code { background:rgba(127,127,127,.14); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>超星学习通 · 自动化服务</h1>
      <div class="sub">请使用管理员分配的账号登录；额度用完后可用卡密兑换。</div>
    </div>
    <div class="body">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% if not auth_enabled %}
      <div class="error" style="background:#fef3c7;color:#92400e">
        服务端当前关闭了鉴权（server.auth_enabled=false），可直接访问控制台。
      </div>
      {% endif %}
      <form method="post" id="loginForm" autocomplete="off">
        <div class="field">
          <label>用户名</label>
          <input type="text" name="username" id="username" placeholder="用户名" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" name="password" id="password" placeholder="密码" autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn">登录</button>
      </form>
      <div class="tip">
        管理员入口：<code>{{ admin_path }}</code>（同一个登录框，管理员登录后可进入后台）<br>
        忘记密码或没有账号？请联系服务管理员。
      </div>
    </div>
  </div>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = '登录中…';
    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    }).then(function (resp) {
      return resp.json().catch(function () { return {}; }).then(function (data) {
        if (resp.ok) { location.href = '/'; return; }
        throw new Error(data.error || ('登录失败 (' + resp.status + ')'));
      });
    }).catch(function (err) {
      let box = document.querySelector('.error');
      if (!box) {
        box = document.createElement('div');
        box.className = 'error';
        document.querySelector('.body').prepend(box);
      }
      box.textContent = err.message;
    }).finally(function () {
      btn.disabled = false; btn.textContent = '登录';
    });
  });
</script>
</body>
</html>
